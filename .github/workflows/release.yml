# Сборка Windows-версии «Город помнит» без установки Python.
# Старая игра собирается отдельно (build-windows.yml) — к релизу прикрепятся оба архива.
# Запуск: создать Release на GitHub (тег вида v0.5.0) — архив сам прикрепится к релизу.
# Или вручную: Actions → «Сборка Windows — Город помнит» → Run workflow (архив будет в Artifacts).
name: Сборка Windows — Город помнит

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main, feature/p2p-pillow]
    paths:
      - 'Kocto/gorod/**'
      - 'Kocto/tests/test_gorod*'
      - 'Kocto/gorod_window.py'
      - 'Kocto/ИГРОКУ.txt'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Kocto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller
        run: python -m pip install pyinstaller==6.11.1 Pillow==11.1.0

      - name: Тесты
        run: python -m unittest discover -s tests -p "test_gorod*.py"

      - name: Сборка exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name GorodPomnit `
            --collect-all PIL --add-data "gorod/data;gorod/data" gorod_window.py
          python -m PyInstaller --noconfirm --onedir --console --name GorodPomnit-console `
            --hidden-import skills --add-data "gorod/data;gorod/data" gorod_console.py
          # консольная версия кладётся в ту же папку, общие библиотеки не дублируются
          Copy-Item dist/GorodPomnit-console/GorodPomnit-console.exe dist/GorodPomnit/
          Copy-Item -Recurse -Force dist/GorodPomnit-console/_internal/* dist/GorodPomnit/_internal/
          Copy-Item ИГРОКУ.txt dist/GorodPomnit/
          $files = Get-ChildItem -Recurse -File dist/GorodPomnit
          if (-not ($files | Where-Object Name -like 'tcl*.dll')) { Write-Error "нет tcl/tk"; exit 1 }
          if (-not ($files | Where-Object Name -eq 'train_phrases.json')) { Write-Error "нет данных игры"; exit 1 }
          if (-not ($files | Where-Object Name -eq 'city.jpg.b64')) { Write-Error "нет графики города"; exit 1 }

      - name: Проверка запуска консольной версии
        shell: pwsh
        run: |
          "Тест`nм`n30 30 30`nвыход`n" | dist/GorodPomnit/GorodPomnit-console.exe

      - name: Проверка оконной версии и встроенной графики
        shell: pwsh
        run: |
          $process = Start-Process dist/GorodPomnit/GorodPomnit.exe -ArgumentList "--smoke-test-ui" -PassThru -Wait
          if ($process.ExitCode -ne 0) { Write-Error "оконная версия не запускается"; exit 1 }
          if (-not (Test-Path dist/GorodPomnit/ui-smoke-ok.json)) { Write-Error "нет результата проверки окна"; exit 1 }
          Remove-Item dist/GorodPomnit/ui-smoke-ok.json

      - name: Архив
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME -replace '[\\/]', '-' } else { 'dev' }
          Compress-Archive -Path dist/GorodPomnit -DestinationPath "GorodPomnit-$tag-windows.zip"
          "ZIP=GorodPomnit-$tag-windows.zip" | Out-File -Append $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: GorodPomnit-windows
          path: Kocto/${{ env.ZIP }}

      - name: Прикрепить к релизу
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ env.ZIP }}" --clobber

      - name: Предварительный релиз 0.6.0 после сборки main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v0.6.0 --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.6.0 --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease `
              --title "Город помнит 0.6.0 — P2P и Pillow (предварительная)" `
              --notes "Два человеческих кандидата по прямому TCP, ИИ-иллюстрации города и NPC, экспорт газеты PNG. LAN/VPN; без автоматического NAT traversal. Распакуйте архив целиком и запускайте GorodPomnit.exe. Версия предварительная до проверки игроками."
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload v0.6.0 "${{ env.ZIP }}" --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
