# Сборка Windows-версии «Город помнит» без установки Python.
# Запуск: создать Release на GitHub (тег вида v0.5.0) — архив сам прикрепится к релизу.
# Или вручную: Actions → «Сборка Windows» → Run workflow (архив будет в Artifacts).
name: Сборка Windows

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Kocto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Тесты
        run: python -m unittest discover -s tests -p "test_gorod*.py"

      - name: PyInstaller
        run: python -m pip install pyinstaller==6.11.1

      - name: Сборка exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Kochto `
            --add-data "gorod/data;gorod/data" gorod_window.py
          python -m PyInstaller --noconfirm --onedir --console --name Kochto-console `
            --hidden-import skills --add-data "gorod/data;gorod/data" gorod_console.py
          # консольная версия кладётся в ту же папку, общие библиотеки не дублируются
          Copy-Item dist/Kochto-console/Kochto-console.exe dist/Kochto/
          Copy-Item -Recurse -Force dist/Kochto-console/_internal/* dist/Kochto/_internal/
          Copy-Item ИГРОКУ.txt dist/Kochto/

      - name: Проверка запуска консольной версии
        shell: pwsh
        run: |
          "Тест`nм`n30 30 30`nвыход`n" | dist/Kochto/Kochto-console.exe

      - name: Архив
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME -replace '[\\/]', '-' } else { 'dev' }
          Compress-Archive -Path dist/Kochto -DestinationPath "Kochto-$tag-windows.zip"
          "ZIP=Kochto-$tag-windows.zip" | Out-File -Append $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: Kochto-windows
          path: Kocto/${{ env.ZIP }}

      - name: Прикрепить к релизу
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ env.ZIP }}" --clobber
