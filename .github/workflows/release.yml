# Сборка Windows-версии «Город помнит» без установки Python.
# Старая игра собирается отдельно (build-windows.yml) — к релизу прикрепятся оба архива.
# Запуск: создать Release на GitHub (тег вида v0.5.0) — архив сам прикрепится к релизу.
# Или вручную: Actions → «Сборка Windows — Город помнит» → Run workflow (архив будет в Artifacts).
name: Сборка Windows — Город помнит

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main, feature/neural-ai-075]
    paths:
      - 'Kocto/gorod/**'
      - 'Kocto/tests/test_gorod*'
      - 'Kocto/gorod_window.py'
      - 'Kocto/ИГРОКУ.txt'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Kocto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller
        run: python -m pip install pyinstaller==6.11.1 Pillow==11.1.0

      - name: Тесты
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_gorod*.py" 2>&1 | Tee-Object test-output.txt
          if ($LASTEXITCODE -ne 0) {
            $details = (Get-Content test-output.txt -Raw) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error::$details"
            exit 1
          }

      - name: Версия
        shell: pwsh
        run: |
          $version = python -c "from gorod import __version__; print(__version__)"
          "VERSION=$version" | Out-File -Append $env:GITHUB_ENV

      - name: Самостоятельные exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GorodPomnit `
            --collect-all PIL --add-data "gorod/data;gorod/data" gorod_window.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m PyInstaller --noconfirm --clean --onefile --console --name GorodPomnit-console `
            --hidden-import skills --add-data "gorod/data;gorod/data" gorod_console.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force dist/package/GorodPomnit | Out-Null
          Copy-Item dist/GorodPomnit.exe, dist/GorodPomnit-console.exe dist/package/GorodPomnit/
          Copy-Item ИГРОКУ.txt, Диагностика_графики.bat dist/package/GorodPomnit/

      - name: Архив
        shell: pwsh
        run: |
          $zip = "GorodPomnit-$env:VERSION-windows.zip"
          Compress-Archive -Path dist/package/GorodPomnit -DestinationPath $zip
          "ZIP=$zip" | Out-File -Append $env:GITHUB_ENV

      - name: Проверка именно распакованного архива и одиночного exe
        shell: pwsh
        run: |
          $clean = Join-Path $env:RUNNER_TEMP ("Проверка игры " + [guid]::NewGuid().ToString())
          Expand-Archive -Path "$env:ZIP" -DestinationPath $clean
          $folder = Join-Path $clean "GorodPomnit"
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
          "Тест`nм`n30 30 30`nвыход`n" | & (Join-Path $folder "GorodPomnit-console.exe")
          if ($LASTEXITCODE -ne 0) { Write-Error "Консоль из архива не запускается"; exit 1 }
          # Only the GUI exe, with no _internal folder or sibling console dependencies.
          $single = Join-Path $clean "Только один exe"
          New-Item -ItemType Directory -Force $single | Out-Null
          Copy-Item (Join-Path $folder "GorodPomnit.exe") $single
          $process = Start-Process (Join-Path $single "GorodPomnit.exe") -WorkingDirectory $single -ArgumentList "--smoke-test-ui" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            $errorFile = Join-Path $single "ui-smoke-error.txt"
            if (Test-Path $errorFile) {
              $details = (Get-Content $errorFile -Raw) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Output "::error::$details"
            }
            Write-Error "Самостоятельный exe не прошёл проверку графики"; exit 1
          }
          if (-not (Test-Path (Join-Path $single "ui-smoke-ok.json"))) { Write-Error "Нет результата проверки"; exit 1 }
          $diag = Start-Process (Join-Path $single "GorodPomnit.exe") -WorkingDirectory $single -ArgumentList "--diagnose-graphics" -PassThru -Wait
          if ($diag.ExitCode -ne 0) { Write-Error "Не работает диагностика"; exit 1 }
          $result = Get-Content (Join-Path $single "graphics-diagnostic.txt") -Raw | ConvertFrom-Json
          if (-not $result.pillow_available) { Write-Error "Встроенный Pillow не загрузился"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: GorodPomnit-windows
          path: Kocto/${{ env.ZIP }}

      - name: Прикрепить к релизу
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ env.ZIP }}" --clobber

      - name: Предварительный релиз после проверенной сборки main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease `
              --title "Город помнит $env:VERSION — локальная нейросеть и свои кнопки (предварительная)" `
              --notes "0.7.5: локальная MLP-нейросеть распознавания намерений (Python stdlib, без облака), объяснение кандидатов и память исправлений. Вставка: кнопка, Ctrl+V, Shift+Insert, контекстное меню. Свои именованные кнопки-шаблоны: создание, редактирование, удаление, сохранение рядом с exe. Кнопки готовят разбор, но не выполняют ход без подтверждения. Старые сохранения читаются; обоим P2P-игрокам нужна 0.7.5. Python, Pillow, веса модели и изображения включены. Проверки Windows: тесты, нейросеть, буфер, кнопки, окно, графика, TCP и запуск из папки с кириллицей."
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $tag "${{ env.ZIP }}" --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
