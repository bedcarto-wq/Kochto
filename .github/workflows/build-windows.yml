name: Сборка для Windows

# Kochto.exe со встроенным Python: друзьям ничего устанавливать не нужно.
on:
  workflow_dispatch:
  push:
    branches: [main, fix/playable-core]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Тесты
        working-directory: Kocto
        env:
          PYTHONUTF8: "1"
        run: |
          python main.py --selftest
          python tests/smoke_test.py

      - name: PyInstaller (Python и tkinter внутри сборки)
        working-directory: Kocto
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --onedir --windowed --name Kochto `
            --hidden-import tkinter --hidden-import tkinter.messagebox `
            --hidden-import nn_rivals --hidden-import nn_recognizer `
            --hidden-import nn_analyzer --hidden-import nn_writer `
            main.py

      - name: Данные рядом с exe
        shell: pwsh
        working-directory: Kocto
        run: |
          Copy-Item -Recurse data dist/Kochto/data
          Remove-Item -Recurse -Force dist/Kochto/data/nn/eval -ErrorAction SilentlyContinue
          Remove-Item -Force dist/Kochto/data/nn/memory/constructions.json -ErrorAction SilentlyContinue
          Remove-Item -Force dist/Kochto/data/laws/custom_laws.json -ErrorAction SilentlyContinue
          Copy-Item "КАК_ИГРАТЬ.txt" dist/Kochto/

      - name: Проверка exe (самотест без Python в PATH)
        shell: pwsh
        working-directory: Kocto/dist/Kochto
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $p = Start-Process -FilePath ".\Kochto.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Kochto.exe --selftest вернул $($p.ExitCode)"; exit 1 }

      - name: Архив
        shell: pwsh
        working-directory: Kocto/dist
        run: Compress-Archive -Path Kochto -DestinationPath Kochto-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Kochto-windows
          path: Kocto/dist/Kochto-windows.zip

      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Kocto/dist/Kochto-windows.zip
