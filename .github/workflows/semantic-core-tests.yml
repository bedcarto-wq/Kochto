name: Semantic core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  semantic-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Semantic core and Russian parser tests
        run: python -m unittest discover -s Kocto/tests -p 'test_semantic*.py' -v
      - name: Existing game smoke test
        run: python Kocto/tests/smoke_test.py
